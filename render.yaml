services:
  - type: web
    name: candidate-shortlisting-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_TITLE
        value: Candidate Shortlisting System
      - key: PORT
        value: "5000"
      - key: NODE_ENV
        value: "production"
